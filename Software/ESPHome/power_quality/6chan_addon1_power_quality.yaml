# This file contains power quality values that are available for each phase
# Enabling these on every current channel is possible, but will produce a lot of data
# and sensors that are likely not needed.
# More details on each sensor here: https://esphome.io/components/sensor/atm90e32.html#configuration-variables

sensor:
- id: !extend ${addon1_id1}
  phase_a:
    reactive_power:
      name: ${ct7_name} VAR
      id: ct7VAR
    apparent_power:
      name: ${ct7_name} VA
      id: ct7VA
    power_factor:
      name: ${ct7_name} Power Factor
      id: ct7PF
  phase_b:
    reactive_power:
      name: ${ct8_name} VAR
      id: ct8VAR
    apparent_power:
      name: ${ct8_name} VA
      id: ct8VA
    power_factor:
      name: ${ct8_name} Power Factor
      id: ct8PF
  phase_c:
    reactive_power:
      name: ${ct9_name} VAR
      id: ct9VAR
    apparent_power:
      name: ${ct9_name} VA
      id: ct9VA
    power_factor:
      name: ${ct9_name} Power Factor
      id: ct9PF

- id: !extend ${addon1_id2}
  phase_a:
    reactive_power:
      name: ${ct10_name} VAR
      id: ct10VAR
    apparent_power:
      name: ${ct10_name} VA
      id: ct10VA
    power_factor:
      name: ${ct10_name} Power Factor
      id: ct10PF
  phase_b:
    reactive_power:
      name: ${ct11_name} VAR
      id: ct11VAR
    apparent_power:
      name: ${ct11_name} VA
      id: ct11VA
    power_factor:
      name: ${ct11_name} Power Factor
      id: ct11PF
  phase_c:
    reactive_power:
      name: ${ct12_name} VAR
      id: ct12VAR
    apparent_power:
      name: ${ct12_name} VA
      id: ct12VA
    power_factor:
      name: ${ct12_name} Power Factor
      id: ct12PF
