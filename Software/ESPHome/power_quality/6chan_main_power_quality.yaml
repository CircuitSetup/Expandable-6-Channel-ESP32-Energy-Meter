# This file contains power quality values that are available for each phase
# Enabling these on every current channel is possible, but will produce a lot of data
# and sensors that are likely not needed.
# More details on each sensor here: https://esphome.io/components/sensor/atm90e32.html#configuration-variables

sensor:
- id: !extend ${main_meter_id1}
  phase_a:
    reactive_power:
      name: ${ct1_name} VAR
      id: ct1VAR
    apparent_power:
      name: ${ct1_name} VA
      id: ct1VA
    power_factor:
      name: ${ct1_name} Power Factor
      id: ct1PF
  phase_b:
    reactive_power:
      name: ${ct2_name} VAR
      id: ct2VAR
    apparent_power:
      name: ${ct2_name} VA
      id: ct2VA
    power_factor:
      name: ${ct2_name} Power Factor
      id: ct2PF
  phase_c:
    reactive_power:
      name: ${ct3_name} VAR
      id: ct3VAR
    apparent_power:
      name: ${ct3_name} VA
      id: ct3VA
    power_factor:
      name: ${ct3_name} Power Factor
      id: ct3PF

- id: !extend ${main_meter_id2}
  phase_a:
    reactive_power:
      name: ${ct4_name} VAR
      id: ct4VAR
    apparent_power:
      name: ${ct4_name} VA
      id: ct4VA
    power_factor:
      name: ${ct4_name} Power Factor
      id: ct4PF
  phase_b:
    reactive_power:
      name: ${ct5_name} VAR
      id: ct5VAR
    apparent_power:
      name: ${ct5_name} VA
      id: ct5VA
    power_factor:
      name: ${ct5_name} Power Factor
      id: ct5PF
  phase_c:
    reactive_power:
      name: ${ct6_name} VAR
      id: ct6VAR
    apparent_power:
      name: ${ct6_name} VA
      id: ct6VA
    power_factor:
      name: ${ct6_name} Power Factor
      id: ct6PF
