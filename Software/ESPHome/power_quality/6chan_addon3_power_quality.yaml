# This file contains power quality values that are available for each phase
# Enabling these on every current channel is possible, but will produce a lot of data
# and sensors that are likely not needed.
# More details on each sensor here: https://esphome.io/components/sensor/atm90e32.html#configuration-variables

sensor:
- id: !extend ${addon3_id1}
  phase_a:
    reactive_power:
      name: ${ct19_name} VAR
      id: ct19VAR
    apparent_power:
      name: ${ct19_name} VA
      id: ct19VA
    power_factor:
      name: ${ct19_name} Power Factor
      id: ct19PF
  phase_b:
    reactive_power:
      name: ${ct20_name} VAR
      id: ct20VAR
    apparent_power:
      name: ${ct20_name} VA
      id: ct20VA
    power_factor:
      name: ${ct20_name} Power Factor
      id: ct20PF
  phase_c:
    reactive_power:
      name: ${ct21_name} VAR
      id: ct21VAR
    apparent_power:
      name: ${ct21_name} VA
      id: ct21VA
    power_factor:
      name: ${ct21_name} Power Factor
      id: ct21PF

- id: !extend ${addon3_id2}
  phase_a:
    reactive_power:
      name: ${ct22_name} VAR
      id: ct22VAR
    apparent_power:
      name: ${ct22_name} VA
      id: ct22VA
    power_factor:
      name: ${ct22_name} Power Factor
      id: ct22PF
  phase_b:
    reactive_power:
      name: ${ct23_name} VAR
      id: ct23VAR
    apparent_power:
      name: ${ct23_name} VA
      id: ct23VA
    power_factor:
      name: ${ct23_name} Power Factor
      id: ct23PF
  phase_c:
    reactive_power:
      name: ${ct24_name} VAR
      id: ct24VAR
    apparent_power:
      name: ${ct24_name} VA
      id: ct24VA
    power_factor:
      name: ${ct24_name} Power Factor
      id: ct24PF
