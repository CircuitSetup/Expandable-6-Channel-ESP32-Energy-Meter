# This file contains power quality values that are available for each phase
# Enabling these on every current channel is possible, but will produce a lot of data
# and sensors that are likely not needed.
# More details on each sensor here: https://esphome.io/components/sensor/atm90e32.html#configuration-variables

sensor:
- id: !extend ${addon4_id1}
  phase_a:
    reactive_power:
      name: ${ct25_name} VAR
      id: ct25VAR
    apparent_power:
      name: ${ct25_name} VA
      id: ct25VA
    power_factor:
      name: ${ct25_name} Power Factor
      id: ct25PF
  phase_b:
    reactive_power:
      name: ${ct26_name} VAR
      id: ct26VAR
    apparent_power:
      name: ${ct26_name} VA
      id: ct26VA
    power_factor:
      name: ${ct26_name} Power Factor
      id: ct26PF
  phase_c:
    reactive_power:
      name: ${ct27_name} VAR
      id: ct27VAR
    apparent_power:
      name: ${ct27_name} VA
      id: ct27VA
    power_factor:
      name: ${ct27_name} Power Factor
      id: ct27PF

- id: !extend ${addon4_id2}
  phase_a:
    reactive_power:
      name: ${ct28_name} VAR
      id: ct28VAR
    apparent_power:
      name: ${ct28_name} VA
      id: ct28VA
    power_factor:
      name: ${ct28_name} Power Factor
      id: ct28PF
  phase_b:
    reactive_power:
      name: ${ct29_name} VAR
      id: ct29VAR
    apparent_power:
      name: ${ct29_name} VA
      id: ct29VA
    power_factor:
      name: ${ct29_name} Power Factor
      id: ct29PF
  phase_c:
    reactive_power:
      name: ${ct30_name} VAR
      id: ct30VAR
    apparent_power:
      name: ${ct30_name} VA
      id: ct30VA
    power_factor:
      name: ${ct30_name} Power Factor
      id: ct30PF
