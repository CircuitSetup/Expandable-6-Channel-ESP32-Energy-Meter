# This file contains power quality values that are available for each phase
# Enabling these on every current channel is possible, but will produce a lot of data
# and sensors that are likely not needed.
# More details on each sensor here: https://esphome.io/components/sensor/atm90e32.html#configuration-variables

sensor:
- id: !extend ${addon2_id1}
  phase_a:
    reactive_power:
      name: ${ct13_name} VAR
      id: ct13VAR
    apparent_power:
      name: ${ct13_name} VA
      id: ct13VA
    power_factor:
      name: ${ct13_name} Power Factor
      id: ct13PF
  phase_b:
    reactive_power:
      name: ${ct14_name} VAR
      id: ct14VAR
    apparent_power:
      name: ${ct14_name} VA
      id: ct14VA
    power_factor:
      name: ${ct14_name} Power Factor
      id: ct14PF
  phase_c:
    reactive_power:
      name: ${ct15_name} VAR
      id: ct15VAR
    apparent_power:
      name: ${ct15_name} VA
      id: ct15VA
    power_factor:
      name: ${ct15_name} Power Factor
      id: ct15PF

- id: !extend ${addon2_id2}
  phase_a:
    reactive_power:
      name: ${ct16_name} VAR
      id: ct16VAR
    apparent_power:
      name: ${ct16_name} VA
      id: ct16VA
    power_factor:
      name: ${ct16_name} Power Factor
      id: ct16PF
  phase_b:
    reactive_power:
      name: ${ct17_name} VAR
      id: ct17VAR
    apparent_power:
      name: ${ct17_name} VA
      id: ct17VA
    power_factor:
      name: ${ct17_name} Power Factor
      id: ct17PF
  phase_c:
    reactive_power:
      name: ${ct18_name} VAR
      id: ct18VAR
    apparent_power:
      name: ${ct18_name} VA
      id: ct18VA
    power_factor:
      name: ${ct18_name} Power Factor
      id: ct18PF
