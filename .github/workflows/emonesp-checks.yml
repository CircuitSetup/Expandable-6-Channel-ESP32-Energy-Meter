name: EmonESP checks

on:
  pull_request:
    paths:
      - 'Software/EmonESP/**'
      - '.github/workflows/emonesp-checks.yml'
  push:
    paths:
      - 'Software/EmonESP/**'
      - '.github/workflows/emonesp-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Software/EmonESP
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: |
          python tests/test_config_eeprom.py
          python tests/test_web_upload.py
          python tests/test_web_auth.py
          python tests/test_runtime.py
          python tests/test_web_config.py
          node tests/test_calibration_ui.cjs
      - run: |
          bash lib/js/combine.sh
          git diff --exit-code -- src/data/lib.js
      - run: pip install platformio==6.1.19
      - run: pio run -e emonesp-nodemcu32s -e emonesp_deploy
      - run: pio run -e emonesp_spiffs -t buildfs
