name: ESPHome compile

on:
  pull_request:
    paths:
      - 'Software/ESPHome/**'
      - '.github/workflows/esphome-compile.yml'
  push:
    paths:
      - 'Software/ESPHome/**'
      - '.github/workflows/esphome-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: esphome-compile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: generate
        run: echo "matrix=$(python Software/ESPHome/tests/compile_matrix.py)" >> "$GITHUB_OUTPUT"

  compile:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_helper_contract.py
      - run: pip install esphome==2026.8.0
      - run: esphome compile ${{ matrix.configurations }}
