name: ESPHome compile

on:
  pull_request:
    paths:
      - 'Software/ESPHome/**'
      - 'scripts/validate_helper_contract.py'
      - '.github/workflows/esphome-compile.yml'
  push:
    paths:
      - 'Software/ESPHome/**'
      - 'scripts/validate_helper_contract.py'
      - '.github/workflows/esphome-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: esphome-compile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python scripts/validate_helper_contract.py --self-test
      - run: python scripts/validate_helper_contract.py
      - run: python Software/ESPHome/tests/compile_matrix.py --self-test
      - id: generate
        run: echo "matrix=$(python Software/ESPHome/tests/compile_matrix.py)" >> "$GITHUB_OUTPUT"

  compile:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python Software/ESPHome/tests/compile_matrix.py
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install esphome==2026.10.2
      - run: python Software/ESPHome/tests/compile_matrix.py --localize "${{ matrix.configurations }}"
      - run: esphome compile ${{ matrix.configurations }}
